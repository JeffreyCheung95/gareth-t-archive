name: Auto Update Gareth.T Archive

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
      - name: Run auto updater
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python auto_updater.py
      - name: Commit and push updated data & photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add covers/ photos/ data/site_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: sync latest covers, photos & feed" && git push)
