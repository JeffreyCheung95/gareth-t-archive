name: Unpack photo archives

on:
  push:
    paths:
      - 'photos-zips/photos-1.zip'
      - 'photos-zips/photos-2.zip'
      - 'photos-zips/photos-3.zip'
      - 'photos-zips/photos-4.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack photo archives
        run: |
          mkdir -p photos
          for f in photos-zips/photos-*.zip; do
            if [ -f "$f" ]; then
              unzip -o "$f" -d photos
              rm "$f"
            fi
          done
          # remove the now-empty zips folder if empty
          rmdir photos-zips 2>/dev/null || true
          echo "photos on disk: $(ls photos/ | wc -l)"
      - name: Commit extracted photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A photos
          git diff --cached --quiet || git commit -m "Unpack photo archives"
          git push
